services:
  mysql_db:
    image: ${DB_IMAGE_NAME}:v0.1
    build:
      context: ./database
    container_name: ${DB_CONTAINER_NAME}
    restart: always
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASS}
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "mysql_db"]
      timeout: 20s
      retries: 5

  express_server:
    depends_on:
      mysql_db:
        condition: service_healthy
    image: ${SERVER_IMAGE_NAME}:v0.1
    build:
      context: ./server
    container_name: ${SERVER_CONTAINER_NAME}
    restart: always
    ports:
      - ${SERVER_LOCAL_PORT}:3000
    environment:
      - DB_HOST=mysql_db
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_LOCAL_PORT}

volumes:
  mysql_data:
    name: ${DB_VOLUME_NAME}