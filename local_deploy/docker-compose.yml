services:
  mysql_db:
    build: 
      context: .
      dockerfile: dockerfile_db
    container_name: ${DB_CONTAINER_NAME}
    restart: unless-stopped
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      - MYSQL_ROOT_PASSWORD=${DB_PASS}
    healthcheck:
      test: ["CMD", "mysqladmin" ,"ping", "-h", "${DB_HOST}"]
      timeout: 20s
      retries: 5
      
  express_server:
    depends_on:
      mysql_db:
        condition: service_healthy
    build: 
      context: ../server
      dockerfile: ../local_deploy/dockerfile_server
    image: ${SERVER_IMAGE_NAME}:v0.1
    container_name: ${SERVER_CONTAINER_NAME}
    restart: unless-stopped
    ports:
      - ${SERVER_LOCAL_PORT}:3000
    environment:
      - DB_HOST=${DB_HOST}
      - DB_USER=${DB_USER}
      - DB_PASS=${DB_PASS}
      - DB_NAME=${DB_NAME}
      - DB_PORT=${DB_LOCAL_PORT}

volumes:
  mysql_data:
    name: ${DB_VOLUME_NAME}